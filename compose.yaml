services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flashcards
      POSTGRES_USER: flashcards
      POSTGRES_PASSWORD: flashcards
    ports:
      - "55432:5432"
    volumes:
      - flashcards_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcards"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flashcards_postgres:
