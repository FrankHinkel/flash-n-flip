name: flash-n-flip

x-app-image: &app-image
  restart: unless-stopped
  init: true
  env_file:
    - ${FNF_PRODUCTION_ENV_FILE:-../../../secrets/production.env}
  networks:
    - internal

services:
  stun:
    image: coturn/coturn:4.15.0-r0-alpine@sha256:b73dfc469b30ee62ba6c0a1824c502e24438f15e49b5f2dec81fa10315410509
    restart: unless-stopped
    init: true
    read_only: true
    entrypoint: ["/usr/bin/turnserver"]
    command:
      - -n
      - --stun-only
      - --listening-port=3478
      - --no-tcp
      - --no-tls
      - --no-dtls
      - --no-rfc5780
      - --no-software-attribute
      - --no-multicast-peers
      - --relay-threads=0
      - --log-file=stdout
      - --simple-log
      - --pidfile=/tmp/turnserver.pid
    ports:
      - "3478:3478/udp"
    tmpfs:
      - /var/lib/coturn:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=8m
      - /var/tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 32
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - internal

  api:
    <<: *app-image
    image: ${FNF_API_IMAGE:-flash-n-flip-rendezvous:local}
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
      target: api-runtime
      args:
        API_INTERNAL_URL: http://api:4000
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 192m
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    <<: *app-image
    image: ${FNF_WEB_IMAGE:-flash-n-flip-web:local}
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
      target: web-runtime
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/pwa').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
